name: validate

# The merge gate for `main`: render every Flux overlay the way
# kustomize-controller will, then schema-check the result. Alongside, re-run
# the local secret hooks as a backstop.

# 1. Every PR, and every commit that lands on `main`.
on:
  pull_request:
  push:
    branches: [main]

# 2. Read the repository, nothing else.
permissions:
  contents: read

# 3. Pinned tool version, and where kubeconform looks up schemas.
env:
  KUBECONFORM_VERSION: v0.8.0
  # Flux CRD schemas (Kustomization, HelmRelease, HelmRepository) come from
  # the community CRDs-catalog; core kinds from kubeconform's default location.
  SCHEMA_CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 4. install kubeconform
      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      # 5. Render every overlay Flux reconciles. The entry points own the
      #    list, so it is not duplicated here. (`-N` stops yq emitting `---`.)
      - name: Render all Flux overlays
        run: |
          mkdir -p rendered
          for d in $(yq -N 'select(.kind == "Kustomization") | .spec.path' \
                       clusters/staging/*.yaml | sed 's|^\./||'); do
            kubectl kustomize "$d" > "rendered/$(echo "$d" | tr / -).yaml"
          done

      # 6. Schema-check the output
      - name: Validate rendered manifests
        run: |
          kubeconform -summary \
            -schema-location default \
            -schema-location "$SCHEMA_CRDS" \
            -skip Secret \
            rendered/*.yaml

      # 7. The entry points belong to no overlay, so they need their own pass.
      - name: Validate cluster entry points
        run: |
          kubeconform -summary \
            -schema-location default \
            -schema-location "$SCHEMA_CRDS" \
            clusters/staging/apps.yaml \
            clusters/staging/infrastructure.yaml \
            clusters/staging/monitoring.yaml

  # 8. Backstop for the local hooks (README → Secrets). They are what keeps
  #    plaintext out of git; this job cannot -- by the time it runs, the
  #    commits are on GitHub. It reports what slipped past them: a clone
  #    without the hooks installed, `--no-verify`, a web-UI edit.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the checks read every commit in the range

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --quiet pre-commit

      # 8a. gitleaks is built from source on first use; keep it between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # 8b. The hooks' own pre-push stage, so the rules live in one place.
      #     Only the new commits: history before them holds an already-
      #     rotated Grafana password that would fail every run.
      - name: Check the new commits for secrets
        id: check
        env:
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pre-commit run --hook-stage pre-push --from-ref "$FROM" --to-ref "$TO"

      # 8c. Blocking the merge is not enough once a secret is public.
      - name: Explain a failure
        if: failure() && steps.check.outcome == 'failure'
        run: |
          echo "::error::A secret reached GitHub. Rotate it first -- it is public" \
               "from the moment it was pushed. Then fix the commit and force-push."
